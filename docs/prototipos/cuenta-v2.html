<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aptiq · Cuenta v2 (propuesta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Valores de docs/tokens.json. Fase 9, parte C, ronda 2: Cuenta. */
  :root { --paper:#EFEEE9; --card:#FBFAF6; --ink:#121316; --graphite:#5E6066; --gs:#4A4C52; --line:#D9D7CF; --hl:#DBFF3E; --st:#C2311B;
    --ease-out:cubic-bezier(0.23,1,0.32,1); --spring:cubic-bezier(0.34,1.4,0.64,1); --mono:'IBM Plex Mono',monospace; --ui:'Instrument Sans',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-wrap:wrap; gap:32px; align-items:flex-start; justify-content:center; padding:32px 16px; background:#E4E3DD; font-family:var(--ui); color:var(--ink); }
  .controles { width:260px; display:flex; flex-direction:column; gap:10px; }
  .controles h1 { font-size:20px; margin:0 0 4px; } .controles p { font-size:13px; line-height:1.45; color:var(--gs); margin:0 0 8px; }
  .controles button { min-height:44px; border-radius:14px; border:1.5px solid var(--ink); background:transparent; font:600 15px var(--ui); cursor:pointer; text-align:left; padding:0 14px; }
  .controles button.on { background:var(--ink); color:var(--hl); }
  .tel { flex:none; position:relative; width:390px; height:844px; overflow:hidden; border-radius:44px; box-shadow:0 30px 80px rgba(18,19,22,.25); background-color:var(--paper);
    background-image:linear-gradient(rgba(18,19,22,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,19,22,.045) 1px,transparent 1px); background-size:24px 24px; }
  .scroll { height:100%; overflow-y:auto; padding:56px 20px 130px; display:flex; flex-direction:column; gap:14px; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .entra { opacity:0; transform:translateY(8px); animation:entra 250ms var(--ease-out) forwards; }
  @keyframes entra { to { opacity:1; transform:none; } }
  .mono { font-family:var(--mono); font-weight:600; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--graphite); }
  h1.t { margin:0; font-size:30px; letter-spacing:-.02em; }

  /* Ficha del opositor */
  .perfil { border-radius:24px; background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.55)); border:1px solid rgba(255,255,255,.95);
    box-shadow:inset 0 1px 0 #fff,0 12px 30px rgba(18,19,22,.12); padding:20px; display:flex; gap:16px; align-items:center; }
  .avatar { width:64px; height:64px; border-radius:50%; background:var(--ink); color:var(--hl); display:grid; place-items:center; font-weight:700; font-size:26px; flex:none; position:relative; }
  .avatar::after { content:''; position:absolute; right:-2px; bottom:-2px; width:20px; height:20px; border-radius:50%; background:var(--hl); border:2px solid var(--ink); }
  .perfil strong { font-size:19px; display:block; } .perfil small { font-size:14px; color:var(--gs); }
  .chips { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .chip { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:999px; border:1.5px solid var(--ink); }
  .chip.pro { background:var(--hl); }

  /* Premium: tarjeta de tinta, el único amarillo grande de la pantalla */
  .premium { background:var(--ink); color:var(--paper); border-radius:24px; padding:20px; display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; }
  .premium .mono { color:var(--hl); }
  .premium h2 { margin:0; font-size:22px; letter-spacing:-.01em; }
  .premium ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; font-size:15px; }
  .premium li { display:flex; gap:8px; align-items:center; }
  .premium li::before { content:''; width:16px; height:16px; border-radius:50%; background:var(--hl); flex:none; }
  .btn { width:100%; min-height:54px; border-radius:14px; border:1.5px solid var(--ink); font:700 17px var(--ui); cursor:pointer; transition:transform 150ms var(--ease-out); }
  .btn:active { transform:scale(.97); }
  .premium .btn { background:var(--hl); border-color:var(--hl); }
  .premium .burb { position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; border:2px solid rgba(219,255,62,.35); }
  .premium .burb.b2 { right:30px; top:40px; width:44px; height:44px; }

  /* Grupos de ajustes en tarjetas */
  .grupo { background:var(--card); border:1px solid var(--line); border-radius:22px; overflow:hidden; }
  .fila { display:flex; align-items:center; gap:14px; min-height:56px; padding:10px 18px; border-top:1px solid rgba(18,19,22,.08); cursor:pointer; transition:background 150ms; }
  .fila:first-child { border-top:0; }
  .fila:active { background:rgba(18,19,22,.04); }
  .ico { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--paper); flex:none; }
  .fila .txt { flex:1; } .fila b { font-size:16px; font-weight:600; display:block; } .fila small { font-size:13px; color:var(--gs); }
  .valor { font-family:var(--mono); font-size:13px; font-weight:600; }
  .fila.peligro b { color:var(--st); }
  .sw { width:48px; height:28px; border-radius:999px; background:rgba(18,19,22,.12); position:relative; transition:background 200ms var(--ease-out); flex:none; }
  .sw::after { content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--card); box-shadow:0 1px 3px rgba(18,19,22,.25);
    transition:transform 250ms var(--spring), background 200ms; }
  .sw.on { background:var(--ink); } .sw.on::after { transform:translateX(20px); background:var(--hl); }
  .horas { display:flex; gap:6px; padding:0 18px 14px 68px; flex-wrap:wrap; }
  .horas span { font-family:var(--mono); font-size:13px; font-weight:600; padding:6px 10px; border-radius:999px; border:1.5px solid var(--ink); cursor:pointer; }
  .horas span.on { background:var(--ink); color:var(--hl); }
  .sinc { display:flex; align-items:center; gap:8px; } .punto { width:8px; height:8px; border-radius:50%; background:var(--ink); }
  .pie { display:flex; gap:8px; font-size:13px; color:var(--gs); line-height:1.4; padding:4px 4px 0; }

  .hoja { position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; justify-content:flex-end; background:rgba(18,19,22,0); pointer-events:none; transition:background 250ms; }
  .hoja.ver { background:rgba(18,19,22,.32); pointer-events:auto; }
  .hoja .panel { background:var(--card); border-radius:24px 24px 0 0; padding:12px 20px 34px; display:flex; flex-direction:column; gap:14px; transform:translateY(100%); transition:transform 250ms var(--ease-out); }
  .hoja.ver .panel { transform:none; }
  .asa { width:36px; height:4px; border-radius:999px; background:var(--line); align-self:center; }
  .meses { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .meses span, .anios span { text-align:center; padding:10px 0; border-radius:999px; border:1.5px solid var(--ink); font-weight:600; cursor:pointer; }
  .meses span.on, .anios span.on { background:var(--ink); color:var(--hl); }
  .meses span.off { opacity:.4; } .anios { display:flex; gap:8px; } .anios span { padding:8px 16px; }
  .campo { min-height:54px; border-radius:14px; border:1.5px solid var(--ink); padding:0 16px; display:flex; align-items:center; font-size:16px; color:var(--graphite); background:#fff; }

  .tabbar { position:absolute; left:20px; right:20px; bottom:24px; display:flex; justify-content:space-around; padding:8px; border-radius:22px; background:rgba(255,255,255,.88);
    border:1px solid rgba(255,255,255,.95); box-shadow:0 12px 30px rgba(18,19,22,.12); z-index:3; }
  .tabbar div { width:62px; height:50px; border-radius:14px; display:grid; place-items:center; } .tabbar .act { background:var(--ink); }
  .fade { position:absolute; left:0; right:0; bottom:0; height:150px; background:linear-gradient(rgba(239,238,233,0),var(--paper) 45%); pointer-events:none; z-index:2; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation-duration:1ms !important; animation-delay:0ms !important; transition-duration:150ms !important; } }
</style>
</head>
<body>
<div class="controles">
  <h1>Cuenta v2 · propuesta</h1>
  <p>Una ficha tuya arriba, Premium como tarjeta destacada y los ajustes agrupados. Prueba los interruptores, la fecha del examen y «Guardar tu progreso».</p>
  <button data-m="gratis" class="on">Sin cuenta · plan gratuito</button>
  <button data-m="pro">Con cuenta · Premium</button>
</div>

<div class="tel">
  <div class="scroll" id="scroll"></div>
  <div class="fade"></div>
  <nav class="tabbar">
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121316" stroke-width="2" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></div>
    <div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121316" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
    <div class="act"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DBFF3E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></div>
  </nav>
  <div class="hoja" id="hoja" onclick="if(event.target===this)cerrar()"><div class="panel" id="panel"></div></div>
</div>

<script>
  const I = {
    bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    sound: '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/>',
    cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    cloud: '<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>',
    doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
    out: '<path d="M10 4H5v16h5"/><path d="M14 8l4 4-4 4M18 12H9"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 .5c0 1.5-2.5 2-2.5 3.5M12 17v.01"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  };
  const ico = (k, c = '#121316') => `<div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg></div>`;
  const chev = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121316" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
  const fila = (k, b, s, der = chev, extra = '') => `<div class="fila ${extra}">${ico(k, extra ? '#C2311B' : '#121316')}<div class="txt"><b>${b}</b>${s ? `<small>${s}</small>` : ''}</div>${der}</div>`;
  let modo = 'gratis', rec = true, son = true, datos = false, mes = 'mar 2027';

  function pinta() {
    const pro = modo === 'pro';
    let d = 0; const e = () => `class="entra" style="animation-delay:${(d++) * 40}ms"`;
    document.getElementById('scroll').innerHTML = `
      <h1 class="t entra">Cuenta</h1>
      <div ${e()}><div class="perfil">
        <div class="avatar">${pro ? 'A' : '?'}</div>
        <div><strong>${pro ? 'ana@correo.es' : 'Aún sin cuenta'}</strong>
          <small>${pro ? 'Practicando desde el 2 nov' : 'Tu progreso se guarda solo en este móvil'}</small>
          <div class="chips"><span class="chip">Guardia Civil</span><span class="chip ${pro ? 'pro' : ''}">${pro ? 'Premium' : 'Plan gratuito'}</span></div></div>
      </div></div>
      ${pro ? '' : `<div ${e()}><div class="premium"><i class="burb"></i><i class="burb b2"></i><span class="mono">Aptiq Premium</span><h2>Entrena sin límites hasta el examen</h2>
        <ul><li>Sesión de hoy y simulacros ilimitados</li><li>Las cinco aptitudes y todos los niveles</li><li>Nivel por aptitud e historial completo</li></ul>
        <button class="btn">Probar 7 días gratis</button></div></div>`}
      ${pro ? '' : `<div ${e()}><div class="grupo">${fila('cloud', 'Guarda tu progreso', 'Con tu correo, por si cambias de móvil', chev).replace('class="fila', 'id="guardar" class="fila')}</div></div>`}
      <div ${e()}><span class="mono">Preferencias</span></div>
      <div ${e()}><div class="grupo">
        ${fila('bell', 'Recordatorio diario', 'Si ya hiciste la sesión de hoy, no avisa', `<div class="sw ${rec ? 'on' : ''}" data-sw="rec"></div>`)}
        ${rec ? '<div class="horas"><span>09:00</span><span>14:00</span><span class="on">19:00</span><span>21:00</span></div>' : ''}
        ${fila('sound', 'Sonidos', 'Al cumplir objetivos y acertar', `<div class="sw ${son ? 'on' : ''}" data-sw="son"></div>`)}
        ${fila('cal', 'Fecha del examen', 'Para la cuenta atrás de Inicio', `<span class="valor">${mes}</span>${chev}`).replace('class="fila', 'id="fecha" class="fila')}
      </div></div>
      ${pro ? `<div ${e()}><span class="mono">Tu cuenta</span></div><div ${e()}><div class="grupo">
        ${fila('cloud', 'Sincronización', '<span class="sinc"><i class="punto"></i>Todo guardado · hace 2 min</span>', '')}
        ${fila('star', 'Premium', 'Se renueva el 2 dic 2026', chev)}
        ${fila('doc', 'Exportar mis datos', 'Archivo con todo lo guardado')}
        ${fila('out', 'Cerrar sesión', '', '')}
        ${fila('trash', 'Borrar cuenta', 'Elimina la cuenta y sus datos', '', 'peligro')}
      </div></div>` : `<div ${e()}><div class="grupo">${fila('star', 'Restaurar compras', 'Si ya pagaste en otro móvil')}</div></div>`}
      <div ${e()}><span class="mono">Ayuda y privacidad</span></div>
      <div ${e()}><div class="grupo">
        ${fila('help', 'Preguntas frecuentes', 'Cuentas, pagos, sin conexión')}
        ${fila('mail', 'Escribir a soporte', 'support@inkfinitysoft.com')}
        ${fila('eye', 'Compartir datos de uso', 'Anónimos. Ayudan a mejorar la app', `<div class="sw ${datos ? 'on' : ''}" data-sw="datos"></div>`)}
        ${fila('doc', 'Privacidad, términos y aviso legal')}
      </div></div>
      <div class="pie entra" style="animation-delay:${d * 40}ms">Aptiq es independiente de la Administración y de la Guardia Civil. Las preguntas son originales. · Versión 1.0.0</div>`;
    document.querySelectorAll('[data-sw]').forEach((s) => s.parentElement.onclick = () => {
      const k = s.dataset.sw; if (k === 'rec') rec = !rec; if (k === 'son') son = !son; if (k === 'datos') datos = !datos;
      s.classList.toggle('on'); if (k === 'rec') setTimeout(pinta, 220);
    });
    document.getElementById('fecha').onclick = hojaFecha;
    const g = document.getElementById('guardar'); if (g) g.onclick = hojaCorreo;
  }
  function abrir(html) { document.getElementById('panel').innerHTML = '<div class="asa"></div>' + html; document.getElementById('hoja').classList.add('ver'); }
  function cerrar() { document.getElementById('hoja').classList.remove('ver'); }
  function hojaFecha() {
    const m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    abrir(`<h2 style="margin:0;font-size:21px">Fecha del examen</h2><div class="anios"><span>2026</span><span class="on">2027</span></div>
      <div class="meses">${m.map((x) => `<span class="${x === 'mar' ? 'on' : ''}">${x}</span>`).join('')}</div>
      <button class="btn" style="background:var(--hl)" onclick="cerrar()">Guardar</button>`);
    document.querySelectorAll('.meses span').forEach((s) => s.onclick = () => { document.querySelectorAll('.meses span').forEach((x) => x.classList.remove('on')); s.classList.add('on'); mes = s.textContent + ' 2027'; pinta(); });
  }
  function hojaCorreo() {
    abrir(`<h2 style="margin:0;font-size:21px">Guarda tu progreso</h2><p style="margin:0;color:var(--gs)">Te enviamos un código de 6 cifras. Sin contraseñas. Se suben tus 3 simulacros y 5 sesiones.</p>
      <div class="campo">nombre@correo.es</div><button class="btn" style="background:var(--hl)" onclick="cerrar()">Enviar código</button>`);
  }
  document.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { document.querySelectorAll('[data-m]').forEach((x) => x.classList.remove('on')); b.classList.add('on'); modo = b.dataset.m; pinta(); });
  pinta();
</script>
</body>
</html>
