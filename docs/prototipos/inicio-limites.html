<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aptiq · Inicio · Plan gratuito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Fase 5 · T5 · Estilos comunes de los prototipos de Cuenta e Historial.
   Valores de docs/tokens.json; mismas recetas que inicio.html. */
body{margin:0;background:#EFEEE9;display:flex;justify-content:center;align-items:flex-start}
.screen{position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;padding:56px 20px 0;display:flex;flex-direction:column;
  font-family:'Instrument Sans',system-ui,sans-serif;color:#121316;background-color:#EFEEE9;
  background-image:linear-gradient(rgba(18,19,22,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,19,22,.045) 1px,transparent 1px);background-size:24px 24px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-10px;border:0;background:transparent;cursor:pointer}
h1{margin:26px 0 0;font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.02em}
.lead{margin:6px 0 0;font-size:16px;line-height:1.45;color:#4A4C52}
.label{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.1em;color:#5E6066}
.mono{font-family:'IBM Plex Mono',monospace}
.glass{display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.8),rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.95);
  box-shadow:inset 0 1px 0 #FFFFFF,0 1px 2px rgba(18,19,22,.06),0 12px 30px rgba(18,19,22,.08);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.btn{width:100%;min-height:54px;border-radius:14px;border:1.5px solid #121316;cursor:pointer;font-family:'Instrument Sans',sans-serif;font-size:17px;font-weight:700;color:#121316;background:transparent}
.btn.primary{background:#DBFF3E}
.btn.text{border-color:transparent;font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}
.input{box-sizing:border-box;width:100%;min-height:54px;padding:0 16px;border-radius:14px;border:1.5px solid #121316;background:transparent;
  font-family:'Instrument Sans',sans-serif;font-size:16px;color:#121316}
.note{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.4;color:#4A4C52}
.note svg{flex:none;margin-top:1px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:52px;padding:0;border:0;border-bottom:1px solid rgba(18,19,22,.14);background:transparent;
  cursor:pointer;text-align:left;font-family:'Instrument Sans',sans-serif;color:#121316;width:100%}
.row .name{flex:1;font-size:17px;font-weight:600}
.row .sub{display:block;font-size:13px;font-weight:400;color:#4A4C52;margin-top:2px}
.row .value{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600}
.section{margin-top:24px;display:flex;align-items:baseline;justify-content:space-between}
.code{display:flex;gap:8px}
.code span{flex:1;height:60px;border-radius:14px;border:1.5px solid #121316;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600}
.code span.empty{border-color:rgba(18,19,22,.3)}
.code span.caret{box-shadow:inset 0 -3px 0 #121316}
.dot{width:8px;height:8px;border-radius:50%;background:#121316;flex:none}
.scrim{position:absolute;inset:0;background:rgba(18,19,22,.32)}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:24px 20px 34px;border-radius:24px 24px 0 0;background:#FBFAF6;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.sheet p{margin:0;font-size:16px;line-height:1.45;color:#4A4C52}
.tabbar{position:absolute;left:20px;right:20px;bottom:24px;display:flex;align-items:center;justify-content:space-around;padding:8px 10px;border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.95);
  box-shadow:inset 0 1px 0 #FFFFFF,0 1px 2px rgba(18,19,22,.06),0 12px 30px rgba(18,19,22,.12);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.tab{width:88px;height:48px;border-radius:14px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent}
.tab.on{background:#121316}

.chart{width:100%;height:150px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:#4A4C52}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.toggle{width:52px;height:32px;border-radius:999px;background:#121316;position:relative;flex:none}
.toggle::after{content:'';position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#DBFF3E}
.toggle.off{background:rgba(18,19,22,.18)}
.toggle.off::after{right:auto;left:4px;background:#FBFAF6}
.hours{display:flex;gap:8px;flex-wrap:wrap}
.hours span{min-width:64px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid #121316;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600}
.hours span.on{background:#121316;color:#FBFAF6}

.x{position:absolute;top:52px;right:12px;width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ticks{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:15px;line-height:1.35}
.ticks li{display:flex;gap:10px}
.ticks svg{flex:none;margin-top:2px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px;border-radius:14px;border:1.5px solid rgba(18,19,22,.3);background:transparent;width:100%;box-sizing:border-box;font-family:'Instrument Sans',sans-serif;color:#121316;text-align:left}
.opt.on{border:2px solid #121316;background:#FFFFFF}
.opt .n{flex:1;font-size:17px;font-weight:600}
.opt .n small{display:block;font-size:13px;font-weight:400;color:#4A4C52;margin-top:2px}
.opt .p{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #121316;flex:none;box-sizing:border-box}
.opt.on .radio{border-width:7px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:#121316;color:#FBFAF6;margin-left:6px;vertical-align:2px}
.legal{font-size:12px;line-height:1.45;color:#5E6066;margin:0}
.lock{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#4A4C52}
</style>
</head>
<body>
<!-- Fase 7 · T3 · Tabla «Monetización». Plan gratuito con el simulacro de la semana y la Sesión de hoy ya hechos. -->
<div class="screen">
<span class="label">GUARDIA CIVIL</span>
<h1 style="margin-top:8px">Sesión de hoy</h1>
<div class="glass" style="margin-top:20px">
<span class="label">SIMULACRO DE ESTA SEMANA · HECHO</span>
<p style="margin:0;font-size:16px;line-height:1.45;color:#4A4C52">El próximo simulacro gratuito está disponible el lunes 23 de noviembre.</p>
<button class="btn">Simulacros ilimitados con Premium</button>
</div>
<div class="section"><span class="label">PRÁCTICA POR APTITUD</span><span class="label">ACIERTO</span></div>
<div class="rows" style="margin-top:4px">
<button class="row" aria-label="Sesión de hoy, hecha, vuelve mañana. Ilimitada con Premium"><span class="name">Sesión de hoy<span class="sub">Hecha · vuelve mañana</span></span><span class="lock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#4A4C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span></button>
<button class="row"><span class="name">Series numéricas</span><span class="value">72 %</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#121316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
<button class="row"><span class="name">Comparación de datos</span><span class="value">64 %</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#121316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
<button class="row"><span class="name">Ordenación alfabética</span><span class="value">80 %</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#121316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
<button class="row" aria-label="Series de letras, incluido en Premium"><span class="name">Series de letras</span><span class="lock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#4A4C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>PREMIUM</span></button>
<button class="row" aria-label="Cálculo y porcentajes, incluido en Premium"><span class="name">Cálculo y porcentajes</span><span class="lock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#4A4C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>PREMIUM</span></button>
</div>
<nav class="tabbar" aria-label="Navegación principal">
<button class="tab on" aria-label="Inicio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#DBFF3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5L12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></button>
<button class="tab" aria-label="Historial"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#121316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
<button class="tab" aria-label="Cuenta"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#121316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
</nav>
</div>
</body>
</html>
