name: Estrés del motor

# 10.000 preguntas por tipo, nivel y número de opciones (skill aptiq-generator):
# cada noche y bajo demanda. La CI normal ya ejecuta 1.000 en cada push.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  estres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:stress
